name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run offline demo
        run: python -m evalforge run --tasks examples/tasks.jsonl --cmd "python examples/mock_model.py" --out /tmp/evalforge-demo.json --report /tmp/evalforge-demo.html --fail-under 1.0
