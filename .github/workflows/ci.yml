name: CI

on:
  push:
    branches: [main, evalforge-cluster-family]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run offline demo
        run: python -m evalforge run --tasks examples/tasks.jsonl --cmd "python examples/mock_model.py" --out /tmp/evalforge-demo.json --report /tmp/evalforge-demo.html --fail-under 1.0
      - name: Regenerate retained paired evidence
        run: |
          python tools/build_audits.py
          git diff --exit-code -- docs/audit.json examples/audit.json
          python tools/build_family.py
          git diff --exit-code -- examples/family.json examples/family-reports.json docs/family-data.js
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
  installed-wheel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: bash tools/wheel_smoke.sh
      - run: bash tools/family_wheel_smoke.sh
